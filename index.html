<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chessmate — Multiplayer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #1a1a2e; color: white; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px; min-height: 100vh; user-select: none;
    }
    h1 { margin: 0 0 6px; font-size: 30px; }
    #status { opacity: 0.85; margin-bottom: 12px; font-size: 16px; text-align: center; min-height: 20px; }
    #board {
      display: grid; grid-template-columns: repeat(8, 1fr); grid-auto-rows: 1fr;
      border: 3px solid #444; border-radius: 6px; overflow: hidden;
    }
    .sq {
      aspect-ratio: 1 / 1; width: 100%; display: flex; align-items: center;
      justify-content: center; cursor: pointer; position: relative; line-height: 1;
    }
    .light { background: #eed7b5; }
    .dark { background: #b07d56; }
    .sel { box-shadow: inset 0 0 0 4px #f7ec59; }
    .hint::after {
      content: ''; position: absolute; width: 28%; height: 28%;
      background: rgba(0,0,0,0.28); border-radius: 50%;
    }
    .piece-w { color: #fff; text-shadow: 0 0 2px #000, 0 1px 2px #000; }
    .piece-b { color: #222; text-shadow: 0 1px 1px rgba(255,255,255,0.3); }
    .btn {
      margin: 8px; padding: 12px 28px; border-radius: 8px; border: none;
      background: #e94560; color: white; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .btn-secondary { background: #4a4a6a; }
    input {
      padding: 12px 20px; border-radius: 8px; border: 2px solid #444;
      background: #2a2a3e; color: white; font-size: 18px; text-align: center;
      letter-spacing: 4px; text-transform: uppercase; width: 200px;
    }
    .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
    .screen.active { display: flex; }
    .code-display {
      background: #2a2a3e; padding: 16px 24px; border-radius: 8px;
      font-size: 32px; letter-spacing: 6px; margin: 12px 0; font-weight: bold;
    }    #debug {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6); color: #7fff7f; font-size: 11px;
      padding: 6px 10px; text-align: center; font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="home-screen" class="screen active">
    <h1>♟ Chessmate</h1>
    <p style="opacity:0.7; margin:8px 0 24px;">Real-time chess with friends</p>
    <button class="btn" onclick="createGame()">🎮 Create Game</button>
    <div style="margin:20px 0; opacity:0.5;">— or —</div>
    <p style="margin:0 0 8px;">Join with code:</p>
    <input type="text" id="join-code-input" maxlength="6" placeholder="ABC123">
    <button class="btn btn-secondary" onclick="joinFromInput()" style="margin-top:12px;">Join Game</button>
  </div>

  <div id="lobby-screen" class="screen">
    <h1>♟ Chessmate</h1>
    <p style="opacity:0.7;">Share this code with your opponent:</p>
    <div class="code-display" id="game-code-display"></div>
    <button class="btn" onclick="shareGame()">📤 Share via WhatsApp</button>
    <p id="lobby-status" style="margin:16px 0; font-size:14px;">Waiting for opponent...</p>
    <button class="btn btn-secondary" onclick="goHome()">← Back</button>
  </div>

  <div id="game-screen" class="screen">
    <h1>♟ Chessmate</h1>
    <div id="status">Connecting...</div>
    <div id="board"></div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn" onclick="requestReset()">🔄 New Game</button>
      <button class="btn btn-secondary" onclick="leaveGame()">🚪 Leave</button>
    </div>
  </div>

  <div id="debug">📡 starting...</div>

  <script>
    var SUPABASE_URL = 'https://rcbmfpqvxxqnfjugedpg.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYm1mcHF2eHhxbmZqdWdlZHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTA0NzksImV4cCI6MjEwMTQyNjQ3OX0.7Xgr3zwaVFxQ4Mrg1nZ5JsJqFljeHBIIxP_eZTRDbQc';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var game = new Chess();
    var selected = null;
    var myColor = 'w';
    var gameCode = null;
    var isCreator = false;
    var opponentJoined = false;    var lastMoveId = 0;
    var pollTimer = null;

    var PIECES = {
      'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙',
      'bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'
    };

    function debug(msg) {
      document.getElementById('debug').textContent = '📡 ' + msg;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }

    function goHome() {
      if (pollTimer) clearInterval(pollTimer);
      gameCode = null; opponentJoined = false; lastMoveId = 0;
      showScreen('home-screen');
      debug('ready');
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function createGame() {
      gameCode = generateCode();
      isCreator = true;
      myColor = 'w';
      document.getElementById('game-code-display').textContent = gameCode;
      showScreen('lobby-screen');
      startPolling();
    }

    function joinFromInput() {
      var code = document.getElementById('join-code-input').value.trim().toUpperCase();
      if (code.length !== 6) { alert('Enter a 6-character code'); return; }
      gameCode = code;
      isCreator = false;
      myColor = 'b';
      showScreen('game-screen');
      render();
      startPolling();
    }

    function joinFromURL(code) {
      gameCode = code;      isCreator = false;
      myColor = 'b';
      showScreen('game-screen');
      render();
      startPolling();
    }

    function shareGame() {
      var url = window.location.origin + window.location.pathname + '?code=' + gameCode;
      var text = 'Play chess with me on Chessmate! 🎮 Code: ' + gameCode + ' ' + url;
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }

    // ===== POLLING-BASED SYNC =====
    function startPolling() {
      debug('polling game ' + gameCode + '...');
      if (pollTimer) clearInterval(pollTimer);
      
      // Check for new moves every 2 seconds
      pollTimer = setInterval(function() {
        checkForMoves();
        checkForOpponent();
      }, 2000);
      
      // Immediate first check
      checkForMoves();
      checkForOpponent();
    }

    function checkForMoves() {
      sb.from('moves')
        .select('id, move_data')
        .eq('game_code', gameCode)
        .gt('id', lastMoveId)
        .order('id', { ascending: true })
        .then(function(result) {
          if (result.data && result.data.length > 0) {
            result.data.forEach(function(row) {
              var mv = game.move(row.move_data);
              if (mv) {
                lastMoveId = row.id;
                render();
                updateStatus();
              }
            });
          }
        })
        .catch(function(err) {
          debug('poll error: ' + err.message);
        });    }

    function checkForOpponent() {
      // Simple heuristic: if there are moves from both colors, opponent is here
      sb.from('moves')
        .select('move_data')
        .eq('game_code', gameCode)
        .limit(10)
        .then(function(result) {
          if (result.data && result.data.length > 0) {
            var hasWhite = result.data.some(function(r){ return r.move_data.color === 'w'; });
            var hasBlack = result.data.some(function(r){ return r.move_data.color === 'b'; });
            if ((isCreator && hasBlack) || (!isCreator && hasWhite)) {
              if (!opponentJoined) {
                opponentJoined = true;
                if (isCreator) {
                  showScreen('game-screen');
                  render();
                  updateStatus();
                  debug('✅ opponent joined — you are WHITE');
                } else {
                  debug('✅ connected — you are BLACK');
                }
              }
            }
          }
        });
    }

    function sendMove(moveData) {
      sb.from('moves')
        .insert({ game_code: gameCode, move_data: moveData })
        .then(function(result) {
          if (result.error) debug('send error: ' + result.error.message);
        });
    }

    function leaveGame() { goHome(); }

    function requestReset() {
      if (confirm('Start a new game?')) {
        // Insert a special "reset" move
        sendMove({ type: 'reset' });
        game.reset();
        selected = null;
        lastMoveId = 0;
        render();
        updateStatus();
      }
    }
    function sizeBoard() {
      var w = Math.min(window.innerWidth - 16, 560);
      var board = document.getElementById('board');
      board.style.width = w + 'px';
      var sqSize = w / 8;
      var cells = document.querySelectorAll('.sq');
      for (var i = 0; i < cells.length; i++) {
        cells[i].style.fontSize = (sqSize * 0.82) + 'px';
      }
    }

    function render() {
      var board = document.getElementById('board');
      board.innerHTML = '';
      var pos = game.board();
      var order = myColor === 'b' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
      for (var ri = 0; ri < 8; ri++) {
        for (var ci = 0; ci < 8; ci++) {
          var r = order[ri], c = order[ci];
          var sq = document.createElement('div');
          var coord = 'abcdefgh'[c] + (8 - r);
          sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          sq.dataset.sq = coord;
          var p = pos[r][c];
          if (p) {
            var key = (p.color === 'w' ? 'w' : 'b') + p.type.toUpperCase();
            sq.textContent = PIECES[key];
            sq.classList.add(p.color === 'w' ? 'piece-w' : 'piece-b');
          }
          if (selected === coord) sq.classList.add('sel');
          if (selected) {
            var moves = game.moves({ square: selected, verbose: true });
            if (moves.some(function(m){ return m.to === coord; })) sq.classList.add('hint');
          }
          sq.onclick = function(){ tap(this.dataset.sq); };
          board.appendChild(sq);
        }
      }
      sizeBoard();
    }

    function tap(sq) {
      if (game.turn() !== myColor) return;
      if (isCreator && !opponentJoined) return;
      if (selected === sq) { selected = null; render(); return; }
      if (selected) {
        var move = game.move({ from: selected, to: sq, promotion: 'q' });
        if (move !== null) {
          // Send move to database          sendMove({ from: move.from, to: move.to, promotion: 'q', color: move.color });
          selected = null;
          render();
          updateStatus();
          return;
        }
      }
      var piece = game.get(sq);
      if (piece && piece.color === game.turn() && piece.color === myColor) selected = sq;
      else selected = null;
      render();
    }

    function updateStatus() {
      var s = game.turn() === 'w' ? "White's turn" : "Black's turn";
      if (game.in_checkmate()) s = 'Checkmate! ' + (game.turn() === 'w' ? 'Black wins 🎉' : 'White wins 🎉');
      else if (game.in_draw()) s = 'Draw!';
      else if (game.in_check()) s += ' — Check!';
      if (isCreator && !opponentJoined) s = 'Waiting for opponent...';
      document.getElementById('status').innerText = s;
    }

    window.addEventListener('resize', sizeBoard);

    var urlParams = new URLSearchParams(window.location.search);
    var codeFromURL = urlParams.get('code');
    if (codeFromURL && codeFromURL.length === 6) joinFromURL(codeFromURL);
  </script>
</body>
</html>
